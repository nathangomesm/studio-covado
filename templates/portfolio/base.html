{% load static %}
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>

            <li>

            </li>
            <li>

          <div class="hamburger" onclick="toggleMenu()">

            <span></span>

      </div>
    </header>

    <main>
